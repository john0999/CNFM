<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 470" role="img"><title>Diagrama de flujo para saber si un alumno aprobó</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#334155"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
    <ellipse cx="210" cy="35" rx="70" ry="22" fill="#047857" fill-opacity="0.15" stroke="#047857" stroke-width="2.5"/><text x="210" y="40" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="bold">Inicio</text>
    <line x1="210" y1="57" x2="210" y2="88" stroke="#334155" stroke-width="2" marker-end="url(#fl)"/>
    <polygon points="140,92 300,92 280,142 120,142" fill="#2563eb" fill-opacity="0.15" stroke="#2563eb" stroke-width="2.5"/><text x="210" y="122" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1e293b" >Leer calificación</text>
    <line x1="210" y1="142" x2="210" y2="172" stroke="#334155" stroke-width="2" marker-end="url(#fl)"/>
    <polygon points="210,176 290,226 210,276 130,226" fill="#ca8a04" fill-opacity="0.18" stroke="#a16207" stroke-width="2.5"/><text x="210" y="223" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1e293b" >¿calificación</text><text x="210" y="239" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1e293b" font-weight="bold">≥ 6?</text>
    <line x1="130" y1="226" x2="85" y2="226" stroke="#334155" stroke-width="2"/><line x1="85" y1="226" x2="85" y2="316" stroke="#334155" stroke-width="2" marker-end="url(#fl)"/><text x="105" y="216" font-family="Arial, sans-serif" font-size="13" text-anchor="middle"  font-weight="bold" fill="#047857">Sí</text>
    <line x1="290" y1="226" x2="335" y2="226" stroke="#334155" stroke-width="2"/><line x1="335" y1="226" x2="335" y2="316" stroke="#334155" stroke-width="2" marker-end="url(#fl)"/><text x="315" y="216" font-family="Arial, sans-serif" font-size="13" text-anchor="middle"  font-weight="bold" fill="#b91c1c">No</text>
    <polygon points="30,320 160,320 140,365 10,365" fill="#047857" fill-opacity="0.15" stroke="#047857" stroke-width="2.5"/><text x="85" y="347" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1e293b" >Mostrar «Aprobado»</text>
    <polygon points="280,320 410,320 390,365 260,365" fill="#b91c1c" fill-opacity="0.12" stroke="#b91c1c" stroke-width="2.5"/><text x="335" y="347" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1e293b" >Mostrar «No aprobado»</text>
    <polyline points="85,365 85,395 210,395" fill="none" stroke="#334155" stroke-width="2"/>
    <polyline points="335,365 335,395 210,395" fill="none" stroke="#334155" stroke-width="2"/><line x1="210" y1="395" x2="210" y2="418" stroke="#334155" stroke-width="2" marker-end="url(#fl)"/>
    <ellipse cx="210" cy="442" rx="70" ry="22" fill="#047857" fill-opacity="0.15" stroke="#047857" stroke-width="2.5"/><text x="210" y="447" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#1e293b" font-weight="bold">Fin</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 270" role="img"><title>Modelo de áreas: (x + 3)(x + 2) = x² + 5x + 6</title>
<defs>
  <marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker>
</defs>
    <rect x="60" y="40" width="150" height="150" fill="#bfdbfe" stroke="#1e293b" stroke-width="2"/>
    <rect x="210" y="40" width="90" height="150" fill="#bbf7d0" stroke="#1e293b" stroke-width="2"/>
    <rect x="60" y="190" width="150" height="60" fill="#fde68a" stroke="#1e293b" stroke-width="2"/>
    <rect x="210" y="190" width="90" height="60" fill="#fecaca" stroke="#1e293b" stroke-width="2"/>
    <text x="135" y="120" font-family="Arial, sans-serif" font-size="22" fill="#1e293b" text-anchor="middle" font-weight="bold">x²</text>
    <text x="255" y="120" font-family="Arial, sans-serif" font-size="20" fill="#1e293b" text-anchor="middle" font-weight="bold">3x</text>
    <text x="135" y="226" font-family="Arial, sans-serif" font-size="20" fill="#1e293b" text-anchor="middle" font-weight="bold">2x</text>
    <text x="255" y="226" font-family="Arial, sans-serif" font-size="20" fill="#1e293b" text-anchor="middle" font-weight="bold">6</text>
    <text x="135" y="30" font-family="Arial, sans-serif" font-size="15" fill="#1e293b" text-anchor="middle" font-style="italic">x</text><text x="255" y="30" font-family="Arial, sans-serif" font-size="15" fill="#1e293b" text-anchor="middle">3</text>
    <text x="44" y="120" font-family="Arial, sans-serif" font-size="15" fill="#1e293b" text-anchor="middle" font-style="italic">x</text><text x="44" y="226" font-family="Arial, sans-serif" font-size="15" fill="#1e293b" text-anchor="middle">2</text>
    <text x="180" y="266" font-family="Arial, sans-serif" font-size="12"  text-anchor="middle" fill="#1e3a8a" font-weight="bold">(x + 3)(x + 2) = x² + 3x + 2x + 6 = x² + 5x + 6</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 380" role="img"><title>Teorema de Pitágoras con el triángulo 3-4-5: 9 + 16 = 25</title>
<defs>
  <marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker>
</defs><polygon points="130,228 250,228 250,348 130,348" fill="#bfdbfe" fill-opacity="0.6" stroke="#1e293b" stroke-width="2"/><text x="190" y="294" font-family="Arial, sans-serif" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="bold">b² = 16</text><polygon points="130,228 130,138 40,138 40,228" fill="#bbf7d0" fill-opacity="0.6" stroke="#1e293b" stroke-width="2"/><text x="85" y="189" font-family="Arial, sans-serif" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="bold">a² = 9</text><polygon points="130,138 250,228 340,108 220,18" fill="#fde68a" fill-opacity="0.6" stroke="#1e293b" stroke-width="2"/><text x="235" y="129" font-family="Arial, sans-serif" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="bold">c² = 25</text><polygon points="130,228 250,228 130,138" fill="#fff" stroke="#dc2626" stroke-width="3"/><path d="M142 228 V216 H130" fill="none" stroke="#dc2626" stroke-width="2"/><text x="134" y="187" font-family="Arial, sans-serif" font-size="13"  fill="#dc2626" font-weight="bold">a = 3</text><text x="190" y="222" font-family="Arial, sans-serif" font-size="13"  text-anchor="middle" fill="#dc2626" font-weight="bold">b = 4</text><text x="196" y="175" font-family="Arial, sans-serif" font-size="13"  fill="#dc2626" font-weight="bold">c = 5</text><text x="180" y="368" font-family="Arial, sans-serif" font-size="14"  text-anchor="middle" fill="#1e3a8a" font-weight="bold">a² + b² = c²   →   9 + 16 = 25</text></svg>

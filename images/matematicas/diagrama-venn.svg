<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" role="img"><title>Diagrama de Venn: conjuntos A y B dentro del universo U, con su intersección</title>
<defs>
  <marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker>
</defs>
    <rect x="10" y="10" width="380" height="230" rx="12" fill="#f8fafc" stroke="#1e293b" stroke-width="2"/>
    <text x="26" y="34" font-family="Arial, sans-serif" font-size="18" fill="#1e293b" font-weight="bold">U</text>
    <circle cx="155" cy="128" r="82" fill="#3b82f6" fill-opacity="0.35" stroke="#1d4ed8" stroke-width="3"/>
    <circle cx="245" cy="128" r="82" fill="#f59e0b" fill-opacity="0.35" stroke="#b45309" stroke-width="3"/>
    <text x="110" y="132" font-family="Arial, sans-serif" font-size="13"  text-anchor="middle" fill="#1e3a8a" font-weight="bold">Solo A</text>
    <text x="290" y="132" font-family="Arial, sans-serif" font-size="13"  text-anchor="middle" fill="#92400e" font-weight="bold">Solo B</text>
    <text x="200" y="124" font-family="Arial, sans-serif" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="bold">A ∩ B</text>
    <text x="200" y="142" font-family="Arial, sans-serif" font-size="10" fill="#1e293b" text-anchor="middle">(ambos)</text>
    <text x="120" y="62" font-family="Arial, sans-serif" font-size="18"  font-weight="bold" fill="#1d4ed8">A</text><text x="272" y="62" font-family="Arial, sans-serif" font-size="18"  font-weight="bold" fill="#b45309">B</text>
    <text x="200" y="232" font-family="Arial, sans-serif" font-size="11"  text-anchor="middle" fill="#64748b">A ∪ B = todo lo coloreado</text></svg>

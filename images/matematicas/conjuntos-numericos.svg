<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 270" role="img"><title>Conjuntos numéricos: los naturales están dentro de los enteros, éstos dentro de los racionales, y racionales e irracionales forman los reales</title>
<defs>
  <marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker>
</defs>
    <rect x="10" y="10" width="420" height="250" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
    <text x="24" y="34" font-family="Arial, sans-serif" font-size="15"  font-weight="bold" fill="#1d4ed8">ℝ  Reales</text>
    <rect x="24" y="46" width="270" height="200" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
    <text x="36" y="68" font-family="Arial, sans-serif" font-size="14"  font-weight="bold" fill="#047857">ℚ  Racionales</text>
    <text x="36" y="88" font-family="Arial, sans-serif" font-size="11"  fill="#065f46">½   0.75   −3/4   0.333…</text>
    <rect x="36" y="100" width="200" height="134" rx="12" fill="#fefce8" stroke="#ca8a04" stroke-width="2.5"/>
    <text x="48" y="122" font-family="Arial, sans-serif" font-size="14"  font-weight="bold" fill="#a16207">ℤ  Enteros</text>
    <text x="48" y="140" font-family="Arial, sans-serif" font-size="11"  fill="#854d0e">−3   −1   0</text>
    <rect x="48" y="152" width="140" height="70" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
    <text x="60" y="174" font-family="Arial, sans-serif" font-size="13"  font-weight="bold" fill="#c2410c">ℕ  Naturales</text>
    <text x="60" y="198" font-family="Arial, sans-serif" font-size="12"  fill="#9a3412">1, 2, 3, 4 …</text>
    <rect x="306" y="46" width="112" height="200" rx="14" fill="#fdf2f8" stroke="#db2777" stroke-width="2.5"/>
    <text x="362" y="68" font-family="Arial, sans-serif" font-size="12"  text-anchor="middle" font-weight="bold" fill="#be185d">𝕀 Irracionales</text>
    <text x="362" y="110" font-family="Arial, sans-serif" font-size="12"  text-anchor="middle" fill="#9d174d">π = 3.14159…</text>
    <text x="362" y="140" font-family="Arial, sans-serif" font-size="12"  text-anchor="middle" fill="#9d174d">√2 = 1.4142…</text>
    <text x="362" y="170" font-family="Arial, sans-serif" font-size="12"  text-anchor="middle" fill="#9d174d">e = 2.71828…</text>
    <text x="362" y="210" font-family="Arial, sans-serif" font-size="10"  text-anchor="middle" fill="#9d174d">decimales infinitos</text>
    <text x="362" y="224" font-family="Arial, sans-serif" font-size="10"  text-anchor="middle" fill="#9d174d">no periódicos</text></svg>

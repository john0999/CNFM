<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 190" role="img"><title>Adverbios de frecuencia del 100 % (always) al 0 % (never)</title>
<defs>
  <marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker>
</defs><defs><linearGradient id="gf" x1="0" x2="1"><stop offset="0" stop-color="#fecaca"/><stop offset="1" stop-color="#bbf7d0"/></linearGradient></defs>
      <text x="280" y="24" font-family="Arial, sans-serif" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="bold">How often? · ¿Con qué frecuencia?</text>
      <rect x="40" y="80" width="480" height="22" rx="11" fill="url(#gf)" stroke="#94a3b8"/>
      <line x1="520" y1="80" x2="520" y2="56" stroke="#15803d" stroke-width="2"/><circle cx="520" cy="91" r="6" fill="#15803d"/>
        <text x="520" y="48" font-family="Arial, sans-serif" font-size="14"  text-anchor="middle" font-weight="bold" fill="#15803d">always</text><text x="520" y="34" font-family="Arial, sans-serif" font-size="10"  text-anchor="middle" fill="#64748b">100 %</text><line x1="448" y1="102" x2="448" y2="126" stroke="#16a34a" stroke-width="2"/><circle cx="448" cy="91" r="6" fill="#16a34a"/>
        <text x="448" y="142" font-family="Arial, sans-serif" font-size="14"  text-anchor="middle" font-weight="bold" fill="#16a34a">usually</text><text x="448" y="158" font-family="Arial, sans-serif" font-size="10"  text-anchor="middle" fill="#64748b">85 %</text><line x1="376" y1="80" x2="376" y2="56" stroke="#65a30d" stroke-width="2"/><circle cx="376" cy="91" r="6" fill="#65a30d"/>
        <text x="376" y="48" font-family="Arial, sans-serif" font-size="14"  text-anchor="middle" font-weight="bold" fill="#65a30d">often</text><text x="376" y="34" font-family="Arial, sans-serif" font-size="10"  text-anchor="middle" fill="#64748b">70 %</text><line x1="280" y1="102" x2="280" y2="126" stroke="#ca8a04" stroke-width="2"/><circle cx="280" cy="91" r="6" fill="#ca8a04"/>
        <text x="280" y="142" font-family="Arial, sans-serif" font-size="14"  text-anchor="middle" font-weight="bold" fill="#ca8a04">sometimes</text><text x="280" y="158" font-family="Arial, sans-serif" font-size="10"  text-anchor="middle" fill="#64748b">50 %</text><line x1="112" y1="80" x2="112" y2="56" stroke="#ea580c" stroke-width="2"/><circle cx="112" cy="91" r="6" fill="#ea580c"/>
        <text x="112" y="48" font-family="Arial, sans-serif" font-size="14"  text-anchor="middle" font-weight="bold" fill="#ea580c">rarely</text><text x="112" y="34" font-family="Arial, sans-serif" font-size="10"  text-anchor="middle" fill="#64748b">15 %</text><line x1="40" y1="102" x2="40" y2="126" stroke="#dc2626" stroke-width="2"/><circle cx="40" cy="91" r="6" fill="#dc2626"/>
        <text x="40" y="142" font-family="Arial, sans-serif" font-size="14"  text-anchor="middle" font-weight="bold" fill="#dc2626">never</text><text x="40" y="158" font-family="Arial, sans-serif" font-size="10"  text-anchor="middle" fill="#64748b">0 %</text>
      <text x="280" y="184" font-family="Arial, sans-serif" font-size="11"  text-anchor="middle" fill="#1e3a8a">I always do my homework. · She never drinks coffee. · We sometimes play soccer.</text></svg>

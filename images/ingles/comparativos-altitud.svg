<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" role="img"><title>Comparativos y superlativos con la altitud de tres ciudades de Chiapas</title>
<defs>
  <marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker>
</defs><line x1="10" y1="210" x2="510" y2="210" stroke="#1e293b" stroke-width="2"/><polygon points="30,210 90,172.9 150,210" fill="#bbf7d0" stroke="#1e293b" stroke-width="2"/>
      <text x="90" y="162.9" font-family="Arial, sans-serif" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="bold">530 m</text>
      <text x="90" y="228" font-family="Arial, sans-serif" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="bold">Tuxtla Gutiérrez</text><text x="90" y="246" font-family="Arial, sans-serif" font-size="12"  text-anchor="middle" fill="#1d4ed8" font-weight="bold">high</text><polygon points="200,210 260,98 320,210" fill="#86efac" stroke="#1e293b" stroke-width="2"/>
      <text x="260" y="88" font-family="Arial, sans-serif" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="bold">1,600 m</text>
      <text x="260" y="228" font-family="Arial, sans-serif" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="bold">Comitán</text><text x="260" y="246" font-family="Arial, sans-serif" font-size="12"  text-anchor="middle" fill="#1d4ed8" font-weight="bold">higher</text><polygon points="370,210 430,56 490,210" fill="#22c55e" stroke="#1e293b" stroke-width="2"/>
      <text x="430" y="46" font-family="Arial, sans-serif" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="bold">2,200 m</text>
      <text x="430" y="228" font-family="Arial, sans-serif" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="bold">San Cristóbal</text><text x="430" y="246" font-family="Arial, sans-serif" font-size="12"  text-anchor="middle" fill="#1d4ed8" font-weight="bold">the highest</text><text x="260" y="22" font-family="Arial, sans-serif" font-size="12"  text-anchor="middle" fill="#1e3a8a">San Cristóbal is higher than Comitán. It is the highest of the three.</text></svg>

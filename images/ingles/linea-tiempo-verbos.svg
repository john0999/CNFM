<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 230" role="img"><title>Línea del tiempo de los tiempos verbales: pasado simple, presente perfecto, presente y futuro</title>
<defs>
  <marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker>
</defs>
    <line x1="20" y1="120" x2="585" y2="120" stroke="#1e293b" stroke-width="3" marker-end="url(#fl)" />
    <circle cx="330" cy="120" r="9" fill="#dc2626"/><text x="330" y="150" font-family="Arial, sans-serif" font-size="14"  text-anchor="middle" font-weight="bold" fill="#dc2626">NOW</text>
    <circle cx="110" cy="120" r="7" fill="#2563eb"/>
    <text x="110" y="46" font-family="Arial, sans-serif" font-size="14"  text-anchor="middle" font-weight="bold" fill="#2563eb">Past simple</text>
    <text x="110" y="66" font-family="Arial, sans-serif" font-size="12"  text-anchor="middle" fill="#1e3a8a">I visited Palenque</text><text x="110" y="82" font-family="Arial, sans-serif" font-size="12"  text-anchor="middle" fill="#1e3a8a">last year.</text>
    <text x="110" y="150" font-family="Arial, sans-serif" font-size="11"  text-anchor="middle" fill="#64748b">yesterday · last week</text>
    <path d="M200 112 C240 80 290 80 324 108" fill="none" stroke="#9333ea" stroke-width="3" marker-end="url(#fl)"/>
    <text x="250" y="46" font-family="Arial, sans-serif" font-size="14"  text-anchor="middle" font-weight="bold" fill="#9333ea">Present perfect</text>
    <text x="250" y="66" font-family="Arial, sans-serif" font-size="12"  text-anchor="middle" fill="#6b21a8">I have visited</text><text x="250" y="82" font-family="Arial, sans-serif" font-size="12"  text-anchor="middle" fill="#6b21a8">Palenque twice.</text>
    <text x="250" y="176" font-family="Arial, sans-serif" font-size="11"  text-anchor="middle" fill="#64748b">ever · never · already</text>
    <text x="330" y="190" font-family="Arial, sans-serif" font-size="12"  text-anchor="middle" font-weight="bold" fill="#dc2626">Present simple / continuous</text>
    <text x="330" y="208" font-family="Arial, sans-serif" font-size="11"  text-anchor="middle" fill="#991b1b">I study every day. · I am studying now.</text>
    <circle cx="500" cy="120" r="7" fill="#059669"/>
    <text x="500" y="46" font-family="Arial, sans-serif" font-size="14"  text-anchor="middle" font-weight="bold" fill="#059669">Future</text>
    <text x="500" y="66" font-family="Arial, sans-serif" font-size="12"  text-anchor="middle" fill="#065f46">I am going to study</text><text x="500" y="82" font-family="Arial, sans-serif" font-size="12"  text-anchor="middle" fill="#065f46">at UNACH. (plan)</text>
    <text x="500" y="150" font-family="Arial, sans-serif" font-size="11"  text-anchor="middle" fill="#64748b">I will help you. (decisión)</text></svg>

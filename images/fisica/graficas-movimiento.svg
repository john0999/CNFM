<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 210" role="img"><title>Gráficas de posición contra tiempo (MRU) y velocidad contra tiempo (MRUA)</title>
<defs>
  <marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker>
</defs>
    
      <text x="110" y="18" font-family="Arial, sans-serif" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="bold">MRU: posición – tiempo</text>
      <line x1="40" y1="180" x2="215" y2="180" stroke="#1e293b" stroke-width="2" marker-end="url(#fl)" /><line x1="40" y1="180" x2="40" y2="32" stroke="#1e293b" stroke-width="2" marker-end="url(#fl)" />
      <text x="210" y="198" font-family="Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="end">t (s)</text><text x="46" y="42" font-family="Arial, sans-serif" font-size="11" fill="#1e293b" >x (m)</text>
      <text x="330" y="18" font-family="Arial, sans-serif" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="bold">MRUA: velocidad – tiempo</text>
      <line x1="260" y1="180" x2="435" y2="180" stroke="#1e293b" stroke-width="2" marker-end="url(#fl)" /><line x1="260" y1="180" x2="260" y2="32" stroke="#1e293b" stroke-width="2" marker-end="url(#fl)" />
      <text x="430" y="198" font-family="Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="end">t (s)</text><text x="266" y="42" font-family="Arial, sans-serif" font-size="11" fill="#1e293b" >v (m/s)</text>
    <line x1="40" y1="170" x2="200" y2="60" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
    <text x="120" y="150" font-family="Arial, sans-serif" font-size="11"  fill="#2563eb">pendiente = velocidad</text>
    <path d="M260 160 L420 60 L420 180 L260 180 Z" fill="#fde68a" fill-opacity="0.7"/>
    <line x1="260" y1="160" x2="420" y2="60" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
    <text x="266" y="62" font-family="Arial, sans-serif" font-size="11"  fill="#dc2626">pendiente =</text><text x="266" y="75" font-family="Arial, sans-serif" font-size="11"  fill="#dc2626">aceleración</text>
    <text x="380" y="165" font-family="Arial, sans-serif" font-size="11"  text-anchor="middle" fill="#92400e">área =</text><text x="380" y="177" font-family="Arial, sans-serif" font-size="11"  text-anchor="middle" fill="#92400e">distancia</text></svg>

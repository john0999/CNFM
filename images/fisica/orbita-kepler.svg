  <marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker>
</defs>
    <ellipse cx="210" cy="120" rx="180" ry="95" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4"/>
    <path d="M57 120 L62.6 174.5 A180 95 0 0 1 62.6 65.5 Z" fill="#fde68a" fill-opacity="0.85" stroke="#eab308"/>

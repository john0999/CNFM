    <circle cx="30" cy="120" r="7" fill="#2563eb"/><circle cx="390" cy="120" r="7" fill="#2563eb"/>
    <text x="14" y="18" font-family="Arial, sans-serif" font-size="10"  fill="#a16207" font-weight="bold">Cerca del Sol:</text><text x="14" y="30" font-family="Arial, sans-serif" font-size="10"  fill="#a16207">va más rápido</text>
    <text x="406" y="18" font-family="Arial, sans-serif" font-size="10"  text-anchor="end" fill="#0369a1" font-weight="bold">Lejos del Sol:</text><text x="406" y="30" font-family="Arial, sans-serif" font-size="10"  text-anchor="end" fill="#0369a1">va más lento</text>

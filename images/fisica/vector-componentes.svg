<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 230" role="img"><title>Vector F descompuesto en sus componentes Fx y Fy</title>
<defs>
  <marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker>
</defs>
    <line x1="40" y1="190" x2="300" y2="190" stroke="#94a3b8" stroke-width="2" marker-end="url(#fl)" /><line x1="40" y1="190" x2="40" y2="20" stroke="#94a3b8" stroke-width="2" marker-end="url(#fl)" />
    <text x="296" y="210" font-family="Arial, sans-serif" font-size="12"  fill="#64748b">x</text><text x="24" y="28" font-family="Arial, sans-serif" font-size="12"  fill="#64748b">y</text>
    <line x1="240" y1="190" x2="240" y2="74" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
    <line x1="40" y1="74" x2="240" y2="74" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
    <line x1="40" y1="190" x2="236" y2="190" stroke="#2563eb" stroke-width="4" marker-end="url(#fl)" /><line x1="40" y1="190" x2="40" y2="78" stroke="#16a34a" stroke-width="4" marker-end="url(#fl)" />
    <line x1="40" y1="190" x2="236" y2="77" stroke="#dc2626" stroke-width="4" marker-end="url(#fl)" />
    <path d="M90 190 A50 50 0 0 0 83 165" fill="none" stroke="#1e293b" stroke-width="2"/>
    <text x="96" y="178" font-family="Arial, sans-serif" font-size="15" fill="#1e293b" font-weight="bold">θ</text>
    <text x="140" y="120" font-family="Arial, sans-serif" font-size="16"  fill="#dc2626" font-weight="bold">F</text>
    <text x="120" y="212" font-family="Arial, sans-serif" font-size="12"  fill="#2563eb" font-weight="bold">Fx = F · cos θ</text>
    <text x="48" y="132" font-family="Arial, sans-serif" font-size="12"  fill="#16a34a" font-weight="bold">Fy = F · sen θ</text></svg>

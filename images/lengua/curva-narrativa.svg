<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" role="img"><title>Estructura de una narración: inicio, nudo, clímax y desenlace</title>
    <path d="M20 180 L120 180 Q190 60 240 40 Q270 70 300 140 L400 160" fill="none" stroke="#e11d48" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="60" cy="180" r="9" fill="#0ea5e9" stroke="#1e1b4b" stroke-width="2"/><circle cx="180" cy="98" r="9" fill="#f59e0b" stroke="#1e1b4b" stroke-width="2"/><circle cx="240" cy="40" r="9" fill="#e11d48" stroke="#1e1b4b" stroke-width="2"/><circle cx="350" cy="150" r="9" fill="#10b981" stroke="#1e1b4b" stroke-width="2"/>
    <text x="60" y="205" font-family="Arial, sans-serif" font-size="12" fill="#1e1b4b" text-anchor="middle" font-weight="bold">1. Inicio</text>
    <text x="60" y="160" font-family="Arial, sans-serif" font-size="10" fill="#1e1b4b" text-anchor="middle">Personajes y lugar</text>
    <text x="196" y="132" font-family="Arial, sans-serif" font-size="12" fill="#1e1b4b" font-weight="bold">2. Nudo</text>
    <text x="196" y="146" font-family="Arial, sans-serif" font-size="10" fill="#1e1b4b" >Surge el conflicto</text>
    <text x="240" y="22" font-family="Arial, sans-serif" font-size="12" fill="#1e1b4b" text-anchor="middle" font-weight="bold">3. Clímax</text>
    <text x="262" y="56" font-family="Arial, sans-serif" font-size="10" fill="#1e1b4b" >Momento de</text><text x="262" y="68" font-family="Arial, sans-serif" font-size="10" fill="#1e1b4b" >mayor tensión</text>
    <text x="350" y="185" font-family="Arial, sans-serif" font-size="12" fill="#1e1b4b" text-anchor="middle" font-weight="bold">4. Desenlace</text>
    <text x="350" y="132" font-family="Arial, sans-serif" font-size="10" fill="#1e1b4b" text-anchor="middle">Se resuelve</text></svg>

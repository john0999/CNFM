<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CNFM | Portal Educativo</title>
  <meta name="description" content="Portal educativo de Ciencias Naturales, Matemáticas, Física y Probabilidad para estudiantes de EMSAD Chiapas.">
  
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔬</text></svg>">
  
  <!-- CSS modular -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/componentes.css">
  <link rel="stylesheet" href="css/vistas.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="header">
    <div class="contenedor header-flex">
      <a href="#/" class="logo">
        <span class="logo-icon">🔬</span>
        <div>
          <h1>CNFMPro</h1>
          <p class="subtitulo">Ciencias Naturales, Matemáticas, Física y Probabilidad</p>
        </div>
      </a>
      
      <button id="menuBtn" class="menu-btn" aria-label="Menú">☰</button>
      
      <nav id="nav" class="nav">
        <a href="#/" data-route="home">🏠 Inicio</a>
        <a href="#/ciencias" data-route="ciencias">🔬 Ciencias</a>
        <a href="#/matematicas" data-route="matematicas">📐 Matemáticas</a>
        <a href="#/fisica" data-route="fisica">⚡ Física</a>
        <a href="#/probabilidad" data-route="probabilidad">📊 Probabilidad</a>
        <a href="#/quiz" data-route="quiz">📝 Quiz</a>
        <a href="#/contexto" data-route="contexto">🏔️ Chiapas</a>
        <a href="#/herramientas" data-route="herramientas">🛠️ Recursos</a>
      </nav>
    </div>
  </header>

  <!-- ===== CONTENEDOR DE VISTAS ===== -->
  <main id="app" class="app-container">
    <!-- Las vistas se renderizan aquí dinámicamente -->
  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="footer">
    <div class="contenedor">
      <p>© <span id="anio"></span> EMSAD Chiapas · Portal Educativo</p>
      <p class="footer-nota">Basado en el plan de estudios COSFAC / DGB · Marco Curricular Común</p>
    </div>
  </footer>

  <!-- ===== SCRIPTS (orden importa) ===== -->
  <!-- Core -->
  <script src="js/core/utils.js"></script>
  <script src="js/core/storage.js"></script>
  <script src="js/core/router.js"></script>

  <!-- Data -->
  <script src="js/data/ciencias.js"></script>
  <script src="js/data/matematicas.js"></script>
  <script src="js/data/fisica.js"></script>
  <script src="js/data/probabilidad.js"></script>
  <script src="js/data/contexto.js"></script>
  <script src="js/data/herramientas.js"></script>
  <script src="js/data/quizzes.js"></script>

  <!-- Views -->
  <script src="js/views/home.js"></script>
  <script src="js/views/materia.js"></script>
  <script src="js/views/quiz.js"></script>
  <script src="js/views/contexto.js"></script>
  <script src="js/views/herramientas.js"></script>

  <!-- App -->
  <script src="js/app.js"></script>
</body>
</html>

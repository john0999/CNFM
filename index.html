<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quantix</title>
  <meta name="description"
    content="Portal educativo de bachillerato para EMSAD Chiapas: Ciencias, Química, Física, Matemáticas, Lengua, Inglés, Filosofía y Cultura Digital, alineado al programa MCCEMS.">

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="shortcut icon" href="./images/Quantix.png" type="image/x-icon">
  <meta name="google-site-verification" content="Tc-0V6ilLD4A8wTvJerVbH_MlZEUp5BbD04iMifJAuI" />
  <!-- CSS modular -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/componentes.css">
  <link rel="stylesheet" href="css/vistas.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

  <!-- ===== HEADER ===== -->
  <header class="header">
    <div class="contenedor header-flex">
      <a href="#/"
        style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; padding: 8px 16px;">

        <img src="./images/Quantix.png" alt="Logo Quantix"
          style="width: 48px; height: 48px; object-fit: contain; border-radius: 8px;">

        <div style="display: flex; flex-direction: column; line-height: 1.2;">
          <h1 style="margin: 0; font-size: 1.5rem; font-weight: 700; color: #1a1a1a;">
            Quantix
          </h1>
          <p style="margin: 0; font-size: 0.75rem; color: #666; font-style: italic;">
            Tu bachillerato en un solo lugar · Programa MCCEMS
          </p>
        </div>
      </a>

      <button id="menuBtn" class="menu-btn" aria-label="Menú">☰</button>

      <nav id="nav" class="nav">
        <a href="#/" data-route="home"><i class="fa-solid fa-house" style="color: #64748b;"></i> Inicio</a>

        <!-- Menú «Materias»: el panel se llena desde js/data/materias.js -->
        <div class="nav-materias" id="navMaterias">
          <button type="button" class="nav-materias-btn" id="btnMaterias" aria-expanded="false" aria-controls="panelMaterias">
            <i class="fa-solid fa-layer-group" style="color: #0d9488;"></i> Materias
            <i class="fa-solid fa-chevron-down nav-flecha" aria-hidden="true"></i>
          </button>
          <div class="panel-materias" id="panelMaterias" role="menu"></div>
        </div>

        <a href="#/simuladores" data-route="simuladores"><i class="fa-solid fa-atom" style="color: #8b5cf6;"></i> Simuladores</a>
        <a href="#/herramientas" data-route="herramientas"><i class="fa-solid fa-screwdriver-wrench" style="color: #475569;"></i> Herramientas</a>
      </nav>
    </div>
  </header>

  <!-- ===== CONTENEDOR DE VISTAS ===== -->
  <main id="app" class="app-container">
    <!-- Las vistas se renderizan aquí dinámicamente -->
  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="footer">
    <div class="contenedor footer-flex">
      <div class="footer-info">
        <p>© <span id="anio"></span> QUANTIX </p>
        <p class="footer-nota">Basado en el plan de estudios COBACH / DGB · MCCEMS 2026</p>
      </div>
      <div class="footer-soporte">
        <a href="#/soporte" class="btn-soporte">
          📬 Contactar a Soporte
        </a>
      </div>
    </div>
  </footer>

  <!-- ===== SCRIPTS (orden importa) ===== -->
  <!-- Core -->
  <script src="js/core/utils.js"></script>
  <script src="js/core/storage.js"></script>
  <script src="js/core/router.js"></script>

  <!-- Data -->
  <script src="js/data/ciencias.js"></script>
  <script src="js/data/ciencias-estudio.js"></script>
  <script src="js/data/quimica.js"></script>
  <script src="js/data/quimica-estudio.js"></script>
  <script src="js/data/material-laboratorio.js"></script>
  <script src="js/data/matematicas.js"></script>
  <script src="js/data/matematicas-estudio.js"></script>
  <script src="js/data/fisica.js"></script>
  <script src="js/data/fisica-estudio.js"></script>
  <!-- <script src="js/data/probabilidad.js"></script> -->
  <script src="js/data/contexto.js"></script>
  <script src="js/data/herramientas.js"></script>
  <script src="js/data/quizzes.js"></script>
  <script src="js/data/soporte.js"></script>
  <script src="js/data/simuladores.js"></script>
  <script src="js/data/agente.js"></script>
  <script src="js/data/tabla-periodica.js"></script>
  <script src="js/data/ingles.js"></script>
  <script src="js/data/ingles-estudio.js"></script>
  <script src="js/data/filosofia.js"></script>
  <script src="js/data/cultura-digital.js"></script>
  <script src="js/data/materias.js"></script>
  <script src="js/data/lengua.js"></script>
  <script src="js/data/lengua-estudio.js"></script>

  <!-- Views -->
  <script src="js/views/home.js"></script>
  <script src="js/views/soporte.js"></script>
  <script src="js/views/materia.js"></script>
  <script src="js/views/contexto.js"></script>
  <script src="js/views/herramientas.js"></script>
  <script src="js/views/privado.js"></script>
  <script src="js/views/simuladores.js"></script>
  <script src="js/views/agente.js"></script>
  <script src="js/views/tabla-periodica.js"></script>
  <script src="js/views/vista-fisica.js"></script>
  <script src="js/views/vista-quimica.js"></script>
  <script src="js/views/vista-laboratorio.js"></script>
  <script src="js/views/vista-ingles.js"></script>
  <script src="js/views/vista-filosofia.js"></script>
  <script src="js/views/vista-cultura-digital.js"></script>
  <script src="js/views/vista-matematicas.js"></script>
  <script src="js/views/vista-ciencias.js"></script>
  <script src="js/views/vista-quiz.js"></script>
  <script src="js/views/vista-lengua.js"></script>
  <!-- App -->
  <script src="js/app.js"></script>

  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" onload="renderMathInElement(document.body, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false},
            {left: '\\[', right: '\\]', display: true},
            {left: '\\(', right: '\\)', display: false}
          ],
          throwOnError: false
        });"></script>
</body>

</html>
